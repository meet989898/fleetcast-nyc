name: Scheduled Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Placeholder refresh
        run: python ml/src/fleetcast/ingest.py
